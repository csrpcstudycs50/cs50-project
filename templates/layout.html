<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurement Log Studio</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary text-body min-vh-100 d-flex flex-column">

    <!-- Top Navigation Bar -->
    <nav class="navbar bg-body-secondary border-bottom mb-4 sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-info m-0" href="/">Measurement Studio</a>
            <div class="d-flex flex-row gap-3">
                <a class="nav-link fw-semibold" href="/">Dashboard</a>
                <a class="nav-link fw-semibold text-info" href="/upload">+ New Entry</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container flex-grow-1 mb-5">
        
        <!-- Optional Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show mb-4" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-body-secondary border-top text-center text-body-secondary small">
        <div class="container">
            <span>Spatial Measurement Studio &copy; {{ 2026 }}</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
