{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card bg-body-secondary border p-4">
            <h2 class="h4 fw-bold mb-3">Log New Recipe</h2>

            <form action="/upload" method="POST" enctype="multipart/form-data">

                <!-- Recipe Title -->
                <div class="mb-3">
                    <label for="project_name" class="form-label small fw-semibold">Recipe Title</label>
                    <input type="text" id="project_name" name="project_name" class="form-control"
                        placeholder="e.g., Grandmas Chocolate Chip Cookies" required>
                </div>

                <!-- Image File Input -->
                <div class="mb-3">
                    <label for="image" class="form-label small fw-semibold">Photo</label>
                    <input type="file" id="image" name="image" accept="image/*" class="form-control" required>
                </div>

                <!-- Ingredients Section -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold mb-2">Ingredients</label>

                    <div id="ingredientsContainer" class="d-flex flex-column gap-2">

                        <!-- Ingredient Row 1 -->
                        <div class="ingredient-row p-3 border rounded bg-body-tertiary">

                            <!-- Mobile Header -->
                            <div class="d-flex justify-content-between align-items-center mt-1 mb-2 d-md-none">
                                <span class="ingredient-number badge text-bg-secondary font-monospace">#1</span>
                                <button type="button"
                                    class="btn btn-sm btn-link text-danger text-decoration-none remove-btn p-0 fs-5 lh-1"
                                    title="Remove">
                                    &times;
                                </button>
                            </div>

                            <!-- Form Grid -->
                            <div class="row g-2 align-items-center">
                                <!-- Desktop Badge -->
                                <div class="col-auto d-none d-md-block">
                                    <span class="ingredient-number badge text-bg-secondary font-monospace fs-6">#1</span>
                                </div>

                                <!-- Name Field -->
                                <div class="col-12 col-md">
                                    <input type="text" name="ingredients" class="form-control"
                                        placeholder="Ingredient name (e.g., All-Purpose Flour)" required>
                                </div>

                                <!-- Amount Field -->
                                <div class="col-7 col-md-3">
                                    <input type="number" name="measured_value" class="form-control"
                                        placeholder="Amount" step="any" required>
                                </div>

                                <!-- Unit Select -->
                                <div class="col-5 col-md-3">
                                    <select name="unit" class="form-select" required>
                                        <optgroup label="Volume">
                                            <option value="tsp">tsp</option>
                                            <option value="tbsp">tbsp</option>
                                            <option value="fl oz">fl oz</option>
                                            <option value="cup" selected>cup</option>
                                            <option value="pt">pt</option>
                                            <option value="qt">qt</option>
                                            <option value="gal">gal</option>
                                            <option value="ml">ml</option>
                                            <option value="l">l</option>
                                        </optgroup>
                                        <optgroup label="Weight">
                                            <option value="g">g</option>
                                            <option value="kg">kg</option>
                                            <option value="oz">oz</option>
                                            <option value="lb">lb</option>
                                        </optgroup>
                                        <optgroup label="Other">
                                            <option value="unit">unit</option>
                                            <option value="clove">clove</option>
                                            <option value="pinch">pinch</option>
                                            <option value="dash">dash</option>
                                            <option value="slice">slice</option>
                                            <option value="can">can</option>
                                            <option value="package">pkg</option>
                                        </optgroup>
                                    </select>
                                </div>

                                <!-- Desktop Remove Button -->
                                <div class="col-auto d-none d-md-block">
                                    <button type="button"
                                        class="btn btn-sm btn-outline-danger border-0 remove-btn px-2"
                                        title="Remove">
                                        &times;
                                    </button>
                                </div>
                            </div>

                        </div>

                    </div>

                    <button type="button" id="addIngredientBtn" class="btn btn-outline-info btn-sm mt-3">
                        + Add Another Ingredient
                    </button>
                </div>

                <!-- Instructions Section -->
                <div class="mb-4">
                    <label for="instructions" class="form-label small fw-semibold">Instructions</label>
                    <textarea id="instructions" name="instructions" class="form-control" rows="4"
                        placeholder="Describe the steps to prepare this dish..."></textarea>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2">
                    <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-info fw-bold">Save Record</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
