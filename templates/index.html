<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link href="static/style.css" rel="stylesheet">
        <script src="static/script.js" defer></script>
        <title>2D World Measurement</title>
    </head>
    <body>
        <h1>2D World Measurement Tool</h1>
        <form action="/measure" method="post">
            <input id="imagePicker" capture="environment" type="file" name="image" accept="image/*" required>
            <canvas id="measurementCanvas"></canvas>
            <div>    
                <div id="calibrationContainer">
                    <button type="button" id="calibrationButton" aria-pressed="false">Calibrate</button>
                    <input type="number" id="calibrationValue" name="calibrationValue" placeholder="Line Length" required>
                    <select id="calibrationUnit" name="calibrationUnit" required>
                        <option value="mm">mm</option>
                        <option value="cm">cm</option>
                        <option value="m">m</option>
                        <option value="in">in</option>
                        <option value="ft">ft</option>
                    </select>
                </div>
                <button type="button" id="measure">Measure</button>
                <button type="button" id="reset">Reset</button>
            </div>
            <div>
                <button type="submit">Save</button>
            </div>
        </form>
    </body>
</html>
